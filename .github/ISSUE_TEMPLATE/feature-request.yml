name: 功能建议
description: 描述插件尚未解决的实际问题和期望行为
title: "[Feature] "
labels:
  - "type:feature"
  - "status:needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        请先描述实际使用场景。Issue 内容完全公开，请勿提交授权码、订单号或其他敏感信息。

  - type: dropdown
    id: plugin
    attributes:
      label: 插件名称
      description: 选择建议涉及的插件。
      options:
        - InsekiHead
        - InsekiAuth
        - PokeBall
        - MonthlyPerks
        - InsekiCodeKey
        - TagBackpack
        - AutoSpectator
        - DynamicViewDistance
        - TempAccess
        - CustomJoin
        - BackpackPro
        - AdvancedFlight
        - InsekiGacha
        - ReferralRebate
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 当前遇到的问题
      description: 描述具体使用场景、受影响的用户以及现有行为为什么无法满足需求。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望的行为
      description: 描述你希望插件提供的结果，不要求给出代码实现。
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 当前替代方案
      description: 如果目前有临时做法，请说明其限制；没有可以留空。
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 其他补充信息
      description: 可以补充脱敏截图、示例流程或与建议直接相关的资料。
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我没有提交授权码、订单号、密码、Token、玩家隐私或付费插件文件。
          required: true

  - type: checkboxes
    id: existing_issue
    attributes:
      label: 重复建议确认
      options:
        - label: 我已经搜索已有 Issue，没有找到相同建议。
          required: true

