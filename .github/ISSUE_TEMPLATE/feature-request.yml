name: 功能建议
description: 说说你希望插件增加或改进什么
title: "[Feature] "
labels:
  - "type:feature"
  - "status:needs-triage"
body:
  - type: dropdown
    id: plugin
    attributes:
      label: 插件名称
      options:
        - AccessoryBackpack
        - AdvancedFlight
        - AutoResetWorld
        - AutoSpectator
        - BackpackPro
        - BetterDeath
        - BindingCursePatch
        - BuilderWand
        - BundleLock
        - ConditionalStat
        - CustomJoin
        - DynamicViewDistance
        - EnchantBoost
        - ImmortalPeach
        - InsekiBlockFortune
        - InsekiCodeKey
        - InsekiDurabilityControl
        - InsekiFastContainer
        - InsekiHead
        - InsekiLoot
        - InsekiPickaxe
        - InsekiRuleDialog
        - InsekiToolKit
        - InviteMe
        - ItemNotifier
        - LiteCaptcha
        - MobFarmRateLimit
        - MobLimiter
        - MonthlyPerks
        - PokeBall
        - SakuraHead
        - SakuraMove
        - SaturationPill
        - StealCrops
        - TagBackpack
        - TempAccess
        - UnbreakableGem
        - ZygonSpawner
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你有什么建议？
      description: 按自己的说法描述即可。
      placeholder: 例如：希望称号背包能按名称搜索称号。
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 补充材料（选填）
      description: 截图、示例或相关资料，有就补充。
    validations:
      required: false
