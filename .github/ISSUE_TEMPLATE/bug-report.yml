name: 反馈问题
description: 说说插件哪里不对
title: "[Bug] "
labels:
  - "type:bug"
  - "status:needs-triage"
body:
  - type: dropdown
    id: plugin
    attributes:
      label: 插件名称
      options:
        - AccessoryBackpack
        - AdvancedFlight
        - AutoResetWorld
        - AutoSpectator
        - BackpackPro
        - BetterDeath
        - BindingCursePatch
        - BuilderWand
        - BundleLock
        - ConditionalStat
        - CustomJoin
        - DynamicViewDistance
        - EnchantBoost
        - ImmortalPeach
        - InsekiBlockFortune
        - InsekiCodeKey
        - InsekiDurabilityControl
        - InsekiFastContainer
        - InsekiHead
        - InsekiLoot
        - InsekiPickaxe
        - InsekiRuleDialog
        - InsekiToolKit
        - InviteMe
        - ItemNotifier
        - LiteCaptcha
        - MobFarmRateLimit
        - MobLimiter
        - MonthlyPerks
        - PokeBall
        - SakuraHead
        - SakuraMove
        - SaturationPill
        - StealCrops
        - TagBackpack
        - TempAccess
        - UnbreakableGem
        - ZygonSpawner
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      description: 按自己的说法描述即可。
      placeholder: 例如：打开称号背包后，点击称号没有反应。
    validations:
      required: true

  - type: textarea
    id: additional_context
    attributes:
      label: 补充材料（选填）
      description: 截图、报错或版本信息，有就补充。
    validations:
      required: false
