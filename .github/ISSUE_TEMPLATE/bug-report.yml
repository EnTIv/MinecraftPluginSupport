name: Bug 报告
description: 报告可以稳定描述或复现的插件异常
title: "[Bug] "
labels:
  - "type:bug"
  - "status:needs-triage"
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。Issue 内容完全公开，请勿提交授权码、订单号、密码、Token、数据库连接或付费插件文件。

  - type: dropdown
    id: plugin
    attributes:
      label: 插件名称
      description: 选择出现问题的插件。
      options:
        - AccessoryBackpack
        - AdvancedFlight
        - AutoResetWorld
        - AutoSpectator
        - BackpackPro
        - BetterDeath
        - BindingCursePatch
        - BuilderWand
        - BundleLock
        - ConditionalStat
        - CustomJoin
        - DynamicViewDistance
        - EnchantBoost
        - ImmortalPeach
        - InsekiBlockFortune
        - InsekiCodeKey
        - InsekiDurabilityControl
        - InsekiFastContainer
        - InsekiHead
        - InsekiLoot
        - InsekiPickaxe
        - InsekiRuleDialog
        - InsekiToolKit
        - InviteMe
        - ItemNotifier
        - LiteCaptcha
        - MobFarmRateLimit
        - MobLimiter
        - MonthlyPerks
        - PokeBall
        - SakuraHead
        - SakuraMove
        - SaturationPill
        - StealCrops
        - TagBackpack
        - TempAccess
        - UnbreakableGem
        - ZygonSpawner
    validations:
      required: true

  - type: input
    id: plugin_version
    attributes:
      label: 插件版本
      description: 填写插件文件或插件信息中显示的完整版本号。
      placeholder: 例如 1.3.2
    validations:
      required: true

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft 版本
      placeholder: 例如 1.21.8
    validations:
      required: true

  - type: input
    id: server_software
    attributes:
      label: 服务端及完整构建版本
      description: 请提供 Paper、Purpur、Folia 等服务端名称和完整构建号。
      placeholder: 例如 Purpur 1.21.8-2535
    validations:
      required: true

  - type: input
    id: java_version
    attributes:
      label: Java 版本
      placeholder: 例如 Java 21.0.8
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: 相关依赖及版本
      description: 如果问题涉及 InsekiCore、PlaceholderAPI、Vault 等依赖，请列出名称和版本。
      placeholder: |
        InsekiCore: 
        其他依赖: 
    validations:
      required: false

  - type: textarea
    id: actual_behavior
    attributes:
      label: 实际发生了什么
      description: 描述可观察到的现象、影响范围和发生时机。
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: 你期望发生什么
      description: 描述正常情况下应当出现的行为。
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: 最小复现步骤
      description: 尽量排除无关插件和生产数据，给出从启动服务器开始的最短步骤。
      placeholder: |
        1. 使用上述版本启动服务器
        2. 执行……
        3. 观察到……
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: 复现稳定性
      options:
        - 每次都能复现
        - 经常复现
        - 偶尔复现
        - 只出现过一次
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 脱敏后的相关日志
      description: 粘贴完整异常堆栈；若没有相关日志可以留空。
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: 其他补充信息
      description: 可以拖入脱敏截图，或补充与复现直接相关的配置片段。
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已经移除授权码、订单号、密码、Token、数据库连接、玩家隐私和付费插件文件。
          required: true

  - type: checkboxes
    id: existing_issue
    attributes:
      label: 重复问题确认
      options:
        - label: 我已经搜索已有 Issue，没有找到相同问题。
          required: true

